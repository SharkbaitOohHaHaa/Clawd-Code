name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.18"
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - name: Sync locked environment
        run: uv sync --locked --all-extras --dev

      - name: Capability contract
        run: uv run --locked pytest tests/test_capabilities.py -q

      - name: Full test suite
        run: uv run --locked pytest -q

      - name: Ruff correctness gate
        run: uv run --locked ruff check src tests

      - name: Mypy gradual-typing gate
        run: uv run --locked mypy

  package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.18"
          python-version: "3.12"
          enable-cache: false

      - name: Sync locked environment
        run: uv sync --locked --all-extras --dev

      - name: Build wheel and source distribution
        run: uv build --out-dir dist

      - name: Validate package metadata
        run: uv run --locked python -m twine check dist/*
